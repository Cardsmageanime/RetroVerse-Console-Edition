name: Console Foundation Tests
on:
  push:
  pull_request:
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Console Edition policies
        run: python -m unittest discover -s tests -v
